# Feeds shown on the homepage.
#
# One feed per line:   Category | Source name | RSS URL
# Blank lines and lines starting with # are ignored.
# Reorder, delete, or add lines freely — the fetcher re-reads this file on every
# run, so changes take effect at the next refresh (or run fetch_news.py by hand).
#
# Reuters retired its public RSS feeds, so those two lines go through Google News
# filtered to site:reuters.com. Headlines are Reuters', but the links are Google
# redirects and carry no images.

