# Shortcut tiles on the home page.   Name | URL
#
# fetch_icons.py reads this, caches each site's logo into data/img/icons/, and
# writes data/icons.js. The page uses this list as its defaults, so adding a line
# here changes the tiles for a fresh browser.
#
# Tiles you add or remove in the browser are stored in that browser's
# localStorage and always win over this list. A tile whose site has no cached
# logo falls back to a coloured initial.

Gmail    | https://mail.google.com
Calendar | https://calendar.google.com
Drive    | https://drive.google.com
Claude   | https://claude.ai
GitHub   | https://github.com
YouTube  | https://youtube.com
Maps     | https://maps.google.com
