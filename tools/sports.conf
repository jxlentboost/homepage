# Feeds for the Sports section, below Formula 1.
#
# One feed per line:   Tab | Source name | RSS URL
# Tabs appear in the order first seen here. Blank lines and # lines are ignored,
# and the file is re-read on every run.
#
# Two sources are deliberately not the obvious ones:
#   - NFL.com retired its public RSS (the feed path 404s and the legacy
#     rsslanding URL returns HTML), so the NFL tab uses CBS and ESPN.
#   - indycar.com/rss serves malformed XML, so IndyCar comes from the two
#     motorsport outlets that cover the series properly.

Yahoo   | Yahoo Sports    | https://sports.yahoo.com/rss/

NFL     | CBS NFL         | https://www.cbssports.com/rss/headlines/nfl/
NFL     | ESPN NFL        | https://www.espn.com/espn/rss/nfl/news

CBS     | CBS Sports      | https://www.cbssports.com/rss/headlines/

College | CBS College FB  | https://www.cbssports.com/rss/headlines/college-football/
College | ESPN College FB | https://www.espn.com/espn/rss/ncf/news

IndyCar | Motorsport.com  | https://www.motorsport.com/rss/indycar/news/
IndyCar | Autosport       | https://www.autosport.com/rss/indycar/news/
